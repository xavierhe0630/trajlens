<!doctype html>
<!--
  index.html — standalone episode replay + manual annotation tool.

  Zero server, zero build step, zero network dependency: it reads
  manifest.json (generated by scripts/run_demo.py, or by scripts/export_viewer_manifest.py
  against your own captured data) which embeds small base64 JPEG thumbnails
  directly, so this file can be opened straight from disk (file://) or
  hosted anywhere, and still lets a human page through real captured
  frames and actions and record a keep/discard + quality-score judgment.

  This is the "polished interface welcome but not required" half of the
  assignment. The pipeline is fully exercised without it (see
  trajlens.annotate.simulate_annotator for the automated path used in the
  submitted demo run) — this viewer is for a human reviewer who wants to
  actually look at the data.

  Exported annotations download as a JSON file in the same schema
  trajlens.annotate.Annotation uses, so they can be dropped into
  data/annotations/<your_id>/<session_id>/ep_XXXX.json and picked up by
  export.py on the next dataset build.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TrajLens — Episode Viewer & Annotator</title>
<style>
  :root {
    --bg: #14161c; --panel: #1c1f28; --border: #2c3040; --text: #e8eaf0;
    --muted: #8b91a5; --accent: #5096f0; --good: #3cc878; --bad: #d24646;
    --warn: #e0a83c;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font: 14px/1.4 -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border);
           display:flex; align-items:center; gap:14px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 12px; }
  #layout { display:flex; height: calc(100vh - 53px); }
  #sidebar { width: 280px; border-right:1px solid var(--border); overflow-y:auto; }
  .ep-row { padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer; }
  .ep-row:hover { background: #20232e; }
  .ep-row.active { background: #232a3a; border-left: 3px solid var(--accent); }
  .ep-row .title { font-weight:600; font-size:13px; }
  .ep-row .meta { color:var(--muted); font-size:11px; margin-top:2px; }
  .pill { display:inline-block; padding:1px 7px; border-radius:8px; font-size:10px; font-weight:600; }
  .pill.success { background: rgba(60,200,120,.18); color: var(--good); }
  .pill.collision { background: rgba(210,70,70,.18); color: var(--bad); }
  .pill.timeout { background: rgba(224,168,60,.18); color: var(--warn); }
  #main { flex:1; padding: 18px 24px; overflow-y:auto; }
  #frame-wrap { display:flex; gap:20px; align-items:flex-start; }
  #frame-canvas { width: 320px; height: 320px; border:1px solid var(--border);
                  border-radius:8px; background:#000; image-rendering: pixelated; }
  #scrubber { width: 320px; margin-top:8px; }
  .card { background: var(--panel); border:1px solid var(--border); border-radius:10px;
          padding:14px 16px; margin-bottom:14px; }
  .card h3 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); }
  .stat-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
  .stat { background:#181b23; border-radius:8px; padding:8px 10px; }
  .stat .v { font-size:16px; font-weight:700; }
  .stat .l { font-size:11px; color:var(--muted); }
  button { background: #232838; color: var(--text); border:1px solid var(--border);
           border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; }
  button:hover { border-color: var(--accent); }
  button.active-keep { background: rgba(60,200,120,.22); border-color: var(--good); }
  button.active-discard { background: rgba(210,70,70,.22); border-color: var(--bad); }
  input[type=range] { width:100%; }
  textarea { width:100%; background:#181b23; color:var(--text); border:1px solid var(--border);
             border-radius:6px; padding:8px; font: 13px inherit; resize:vertical; min-height:60px; }
  .row { display:flex; gap:10px; align-items:center; }
  #score-buttons button { width:34px; }
  #export-btn { background: var(--accent); border-color: var(--accent); color:#0b1220; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>TrajLens</h1>
  <span class="sub">episode replay & manual annotation — reads manifest.json, exports annotations.json</span>
</header>
<div id="layout">
  <div id="sidebar"></div>
  <div id="main"></div>
</div>

<script>
let manifest = null;
let current = null;
let annotations = {};   // key: session_id/ep_index -> annotation object

async function load() {
  const res = await fetch("manifest.json");
  manifest = await res.json();
  renderSidebar();
  if (manifest.episodes.length) selectEpisode(0);
}

function key(ep) { return ep.session_id + "/" + ep.episode_index; }

function renderSidebar() {
  const el = document.getElementById("sidebar");
  el.innerHTML = "";
  manifest.episodes.forEach((ep, i) => {
    const row = document.createElement("div");
    row.className = "ep-row" + (i === current ? " active" : "");
    row.onclick = () => selectEpisode(i);
    row.innerHTML = `
      <div class="title">${ep.session_id} · ep ${ep.episode_index}</div>
      <div class="meta"><span class="pill ${ep.outcome}">${ep.outcome}</span> &nbsp;${ep.n_steps} steps</div>`;
    el.appendChild(row);
  });
}

function selectEpisode(i) {
  current = i;
  renderSidebar();
  renderMain();
}

function ensureAnnotation(ep) {
  const k = key(ep);
  if (!annotations[k]) {
    annotations[k] = {
      session_id: ep.session_id, episode_index: ep.episode_index,
      annotator_id: "human_reviewer", keep: ep.outcome === "success",
      quality_score: 3, event_windows: [], notes: "",
    };
  }
  return annotations[k];
}

function renderMain() {
  const ep = manifest.episodes[current];
  const a = ensureAnnotation(ep);
  const el = document.getElementById("main");

  el.innerHTML = `
    <div id="frame-wrap">
      <div>
        <canvas id="frame-canvas" width="64" height="64"></canvas>
        <input id="scrubber" type="range" min="0" max="${ep.frame_indices.length - 1}" value="0" />
        <div class="row" style="margin-top:6px; color:var(--muted); font-size:12px;">
          <span id="frame-label">frame 0</span>
        </div>
      </div>
      <div style="flex:1; min-width:280px;">
        <div class="card">
          <h3>Episode</h3>
          <div class="stat-grid">
            <div class="stat"><div class="v">${ep.outcome}</div><div class="l">outcome</div></div>
            <div class="stat"><div class="v">${ep.n_steps}</div><div class="l">steps</div></div>
            <div class="stat"><div class="v" id="reward-at-frame">-</div><div class="l">reward @ frame</div></div>
          </div>
        </div>
        <div class="card">
          <h3>Annotation</h3>
          <div class="row" style="margin-bottom:10px;">
            <button id="keep-btn">Keep</button>
            <button id="discard-btn">Discard</button>
          </div>
          <div class="row" id="score-buttons" style="margin-bottom:10px;"></div>
          <textarea id="notes" placeholder="notes (e.g. contact near step 40, borderline success)">${a.notes}</textarea>
        </div>
        <button id="export-btn">Export all annotations as JSON</button>
      </div>
    </div>
  `;

  const canvas = document.getElementById("frame-canvas");
  const ctx = canvas.getContext("2d");
  const scrubber = document.getElementById("scrubber");

  function drawFrame(fi) {
    const b64 = ep.frames_b64[fi];
    document.getElementById("frame-label").textContent =
      `frame ${ep.frame_indices[fi]} / ${ep.n_steps - 1}`;
    document.getElementById("reward-at-frame").textContent = ep.rewards[fi].toFixed(2);
    if (!b64) {
      ctx.fillStyle = "#3a1414"; ctx.fillRect(0, 0, 64, 64);
      ctx.fillStyle = "#d24646"; ctx.font = "8px sans-serif";
      ctx.fillText("dropped", 8, 34);
      return;
    }
    const img = new Image();
    img.onload = () => { ctx.clearRect(0,0,64,64); ctx.drawImage(img, 0, 0, 64, 64); };
    img.src = "data:image/jpeg;base64," + b64;
  }
  drawFrame(0);
  scrubber.oninput = () => drawFrame(parseInt(scrubber.value));

  function refreshKeepButtons() {
    document.getElementById("keep-btn").className = a.keep ? "active-keep" : "";
    document.getElementById("discard-btn").className = !a.keep ? "active-discard" : "";
  }
  refreshKeepButtons();
  document.getElementById("keep-btn").onclick = () => { a.keep = true; refreshKeepButtons(); };
  document.getElementById("discard-btn").onclick = () => { a.keep = false; refreshKeepButtons(); };

  const scoreWrap = document.getElementById("score-buttons");
  for (let s = 1; s <= 5; s++) {
    const b = document.createElement("button");
    b.textContent = s;
    b.style.fontWeight = (s === a.quality_score) ? "800" : "400";
    b.style.borderColor = (s === a.quality_score) ? "var(--accent)" : "var(--border)";
    b.onclick = () => { a.quality_score = s; renderMain(); };
    scoreWrap.appendChild(b);
  }
  document.getElementById("notes").onchange = (e) => { a.notes = e.target.value; };

  document.getElementById("export-btn").onclick = () => {
    const blob = new Blob([JSON.stringify(Object.values(annotations), null, 2)],
                           { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = "human_annotations.json";
    link.click();
  };
}

load();
</script>
</body>
</html>
